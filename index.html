<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Workspace</title>
    <style>
        :root {
            --u: min(28px, calc((100vw - 40px) / 38));
            --gap: calc(var(--u) * 0.12);
            --led-color: #38bdf8; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        .setup-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            background-image: url('klvimg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }

        /* --- TO'G'RILANGAN LED CHIROQ --- */
        .setup-led-bar {
            position: absolute;
            bottom: 20.5%;
            left: 4%;
            width: 87%;
            height: 5px;
            background-color: var(--led-color);
            box-shadow: 0 0 18px 3px var(--led-color), 0 0 35px 6px var(--led-color);
            z-index: 4;
            pointer-events: none;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
            opacity: 0.9;
            border-radius: 4px;
        }
        
        .led-gap-center {
            position: absolute;
            bottom: 30.5%;
            left: 45%;
            width: 12%;
            height: 8px;
            background-color: #0f172a;
            z-index: 5;
            opacity: 0.4;
            filter: blur(4px);
        }

        /* --- MONITOR VA JONLI KOD OYNASI --- */
        .monitor-code-overlay {
            position: absolute;
            top: 25.5%;
            left: 26%;
            width: 41%;
            height: 43.5%;
            background: #1e1e1e;
            z-index: 5;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            color: #d4d4d4;
            font-size: 13px;
            line-height: 1.5;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            border: 2px solid rgb(184, 184, 184);
        }

        .code-line {
            display: flex;
            white-space: pre-wrap;
        }

        .code-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #aeafad;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .monitor-off-layer {
            position: absolute;
            top: 26.5%;
            left: 27%;
            width: 39%;
            height: 42.1%;
            background-color: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .monitor-off-text {
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .monitor-off-layer.active {
            opacity: 0.98;
        }

        /* --- MONITOR TAGIDAGI RANGLI TUGMALAR --- */
        .color-buttons-panel {
            position: absolute;
            top: 72%;
            left: 37.5%;
            width: 20%;
            height: 6%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9;
            gap: 5px;
        }
        
        .color-btn {
            width: 16px;
            height: 16px;
            border-radius: 30%;
            border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.35);
            box-shadow: 0 0 12px white;
        }

        /* --- KLAVIATURA --- */
        .keyboard-wrapper {
            position: absolute;
            bottom: 4%;
            left: 40%;
            width: 18%;
            height: 14%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 16, 21, 0.92);
            border-radius: 6px;
            padding: 2px;
        }

        .keyboard-frame {
            background: #50578b;
            padding: calc(var(--u) * 0.3);
            border-radius: calc(var(--u) * 0.2);
            box-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.6) rgba(0, 0, 0, 0.9);
            border: 1px solid #252733;
            display: flex;
            gap: calc(var(--u) * 0.2);
            width: max-content;
            transform: scale(0.58);
            margin-right: 40%;
        }

        .main-typing-block { display: flex; flex-direction: column; gap: var(--gap); }
        .navigation-block { display: flex; flex-direction: column; justify-content: space-between; width: calc(var(--u) * 3 + var(--gap) * 2); }
        .numpad-block { display: flex; flex-direction: column; gap: calc(var(--gap) * 2); width: calc(var(--u) * 4 + var(--gap) * 3); }

        .kb-row { display: flex; gap: var(--gap); }
        .f-gap { margin-right: calc(var(--u) * 0.25); }

        .key {
            background: #232531;
            color: #e2e8f0;
            border: none;
            border-radius: calc(var(--u) * 0.1);
            font-size: calc(var(--u) * 0.24);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: var(--u);
            width: var(--u);
            position: relative;
            transition: all 0.04s ease;
            box-shadow: 0 calc(var(--u) * 0.06) 0 #14151f;
        }

        .key:active, .key.pressed {
            transform: translateY(calc(var(--u) * 0.06));
            box-shadow: 0 0 0 #14151f;
            background: #00ffcc !important;
            color: #0b0c10 !important;
        }

        .key-esc { background: #e53e3e; color: #fff; }
        .key-accent { background: #2d3142; color: #8be9fd; }
        .key-fn { background: #38a169; color: #fff; }
        .key-enter { background: #3182ce; color: #fff; }

        .w-1-25u { width: calc(var(--u) * 1.25); }
        .w-1-5u  { width: calc(var(--u) * 1.5); }
        .w-1-75u { width: calc(var(--u) * 1.75); }
        .w-2u    { width: calc(var(--u) * 2); }
        .w-2-25u { width: calc(var(--u) * 2.25); }
        .w-2-75u { width: calc(var(--u) * 2.75); }
        .w-6-25u { width: calc(var(--u) * 6.25); }

        .nav-grid, .arrow-grid { display: grid; grid-template-columns: repeat(3, var(--u)); gap: var(--gap); }
        .numpad-grid { display: grid; grid-template-columns: repeat(4, var(--u)); grid-template-rows: repeat(5, var(--u)); gap: var(--gap); }
        .h-2u { grid-row: span 2; height: calc(var(--u) * 2 + var(--gap)); }
        .span-2-h { grid-column: span 2; width: calc(var(--u) * 2 + var(--gap)); }

        .led-panel {
            background: #14151f;
            padding: calc(var(--u) * 0.1) calc(var(--u) * 0.2);
            border-radius: calc(var(--u) * 0.1);
            display: flex;
            justify-content: space-between;
            border: 1px solid #2d3142;
        }
        .led-item { display: flex; flex-direction: column; align-items: center; font-size: calc(var(--u) * 0.16); color: #718096; font-weight: bold; }
        .led-light { width: calc(var(--u) * 0.1); height: calc(var(--u) * 0.1); background-color: #2d3748; border-radius: 50%; }
        .led-light.active { background-color: #38a169; box-shadow: 0 0 5px #48bb78; }
        .lbl-sm { font-size: calc(var(--u) * 0.15); line-height: 1.1; }
        .row-space { margin-top: calc(var(--u) * 0.1); }

        /* --- BOSHQA INTERAKTIV ZONALAR --- */
        .interactive-spot {
            position: absolute;
            cursor: pointer;
            background: transparent;
            transition: background 0.2s;
            z-index: 8;
        }
        .interactive-spot:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .camera-spot { top: 6%; left: 40%; width: 10%; height: 20%; border-radius: 10px; }
        .flash-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white; opacity: 0; pointer-events: none; z-index: 1000;
            transition: opacity 0.1s ease-out;
        }
        .flash-overlay.active { opacity: 0.85; }

        .mic-spot { top: 45%; left: 70%; width: 7%; height: 25%; border-radius: 50%; }
        .headphones-spot { top: 78%; left: 10%; width: 13%; height: 18%; transform: rotate(-10deg); border-radius: 12px; }
        
        .mouse-spot { top: 82%; left: 65%; width: 9%; height: 15%; border-radius: 50%; }
        .mouse-glow {
            position: absolute; top: 85%; left: 67%; width: 5% ; height: 8%;
            border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.8) 0%, transparent 70%);
            opacity: 0; pointer-events: none; z-index: 9; transition: opacity 0.2s;
        }
        .mouse-glow.active { opacity: 1; }

        .toast-notification {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 12px 24px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 15px; font-weight: 500;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0; pointer-events: none; z-index: 1001; display: flex; align-items: center; gap: 8px;
        }
        .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .mini-monitor-off-layer {
            position: absolute;
            top: 53.5%;
            left: 13%;
            width: 11%;
            height: 14.5%;
            background-color: black;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 7;
            border-radius: 10px;
        }

        .mini-monitor-off-layer.active {
            opacity: 0.98;
        }

        /* --- RESPONSIVLIK (MEDIA QUERIES) --- */
        @media (max-width: 1024px) {
            .setup-container {
                width: 100vw;
                height: 56.25vw; /* 16:9 nisbatni saqlash uchun */
                min-height: auto;
            }
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }
            .setup-container {
                width: 95vw;
                height: 53.4vw;
            }
            .monitor-code-overlay {
                font-size: 9px;
                padding: 8px;
            }
            .color-buttons-panel {
                width: 30%;
            }
            .color-btn {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="flash-overlay" id="flashOverlay"></div>

    <div class="setup-container">
        
        <div class="setup-led-bar" id="setupLedBar"></div>
        <div class="led-gap-center"></div>

        <div class="monitor-off-layer" id="monitorOffLayer">
            <span class="monitor-off-text">// System Offline</span>
        </div>
        <div class="monitor-code-overlay" id="codeEditor">
            <span id="typedCode">// Hello! Type on the keyboard...</span><span class="code-cursor"></span>
        </div>
        <div class="interactive-spot" style="top:25.5%; left:27.5%; width:42.3%; height:33.5%; z-index:7;" onclick="toggleMonitor()" title="Monitorni o'chirish/yoqish"></div>

        <div class="color-buttons-panel">
            <div class="color-btn" style="background-color: #ef4444;" onclick="changeLedColor('#ef4444', 'Qizil')"></div>
            <div class="color-btn" style="background-color: #22c55e;" onclick="changeLedColor('#22c55e', 'Yashil')"></div>
            <div class="color-btn" style="background-color: #3b82f6;" onclick="changeLedColor('#3b82f6', 'Ko\'k')"></div>
            <div class="color-btn" style="background-color: #eab308;" onclick="changeLedColor('#eab308', 'Sariq')"></div>
            <div class="color-btn" style="background-color: #a855f7;" onclick="changeLedColor('#a855f7', 'Binafsha')"></div>
            <div class="color-btn" style="background-color: #06b6d4;" onclick="changeLedColor('#06b6d4', 'Moviy')"></div>
        </div>

        <div class="interactive-spot camera-spot" onclick="flashCamera()" title="Kamera"></div>
        <div class="interactive-spot mic-spot" onclick="toggleMic()" title="Mikrofon"></div>
        <div class="interactive-spot headphones-spot" onclick="showToast('Quloqchinlar taqildi 🎧', '🎧')" title="Quloqchin"></div>

        <div class="interactive-spot mouse-spot" onclick="clickMouse()" title="Sichqoncha"></div>
        <div class="mouse-glow" id="mouseGlow"></div>
        
        <div class="mini-monitor-off-layer" id="miniMonitorOffLayer">
            <span><h1>// You Photo</h1></span>
        </div>

        <div class="keyboard-wrapper">
            <div class="keyboard-frame">
                <div class="main-typing-block">
                    <div class="kb-row">
                        <button class="key key-esc" data-key="Escape">Esc</button>
                        <div style="width: calc(var(--u) * 0.5);"></div>
                        <button class="key key-accent" data-key="F1">F1</button>
                        <button class="key key-accent" data-key="F2">F2</button>
                        <button class="key key-accent" data-key="F3">F3</button>
                        <button class="key key-accent f-gap" data-key="F4">F4</button>
                        <button class="key key-accent" data-key="F5">F5</button>
                        <button class="key key-accent" data-key="F6">F6</button>
                        <button class="key key-accent" data-key="F7">F7</button>
                        <button class="key key-accent f-gap" data-key="F8">F8</button>
                        <button class="key key-accent" data-key="F9">F9</button>
                        <button class="key key-accent" data-key="F10">F10</button>
                        <button class="key key-accent" data-key="F11">F11</button>
                        <button class="key key-accent" data-key="F12">F12</button>
                    </div>

                    <div class="kb-row row-space">
                        <button class="key" data-key="Backquote">~<br>`</button>
                        <button class="key" data-key="Digit1">!<br>1</button>
                        <button class="key" data-key="Digit2">@<br>2</button>
                        <button class="key" data-key="Digit3">#<br>3</button>
                        <button class="key" data-key="Digit4">$<br>4</button>
                        <button class="key" data-key="Digit5">%<br>5</button>
                        <button class="key" data-key="Digit6">^<br>6</button>
                        <button class="key" data-key="Digit7">&<br>7</button>
                        <button class="key" data-key="Digit8">*<br>8</button>
                        <button class="key" data-key="Digit9">(<br>9</button>
                        <button class="key" data-key="Digit0">)<br>0</button>
                        <button class="key" data-key="Minus">_<br>-</button>
                        <button class="key" data-key="Equal">+<br>=</button>
                        <button class="key key-accent w-2u lbl-sm" data-key="Backspace">Bksp</button>
                    </div>

                    <div class="kb-row">
                        <button class="key key-accent w-1-5u" data-key="Tab">Tab</button>
                        <button class="key" data-key="KeyQ">Q</button>
                        <button class="key" data-key="KeyW">W</button>
                        <button class="key" data-key="KeyE">E</button>
                        <button class="key" data-key="KeyR">R</button>
                        <button class="key" data-key="KeyT">T</button>
                        <button class="key" data-key="KeyY">Y</button>
                        <button class="key" data-key="KeyU">U</button>
                        <button class="key" data-key="KeyI">I</button>
                        <button class="key" data-key="KeyO">O</button>
                        <button class="key" data-key="KeyP">P</button>
                        <button class="key" data-key="BracketLeft">{<br>[</button>
                        <button class="key" data-key="BracketRight">}<br>]</button>
                        <button class="key w-1-5u" data-key="Backslash">|<br>\</button>
                    </div>

                    <div class="kb-row">
                        <button class="key key-accent w-1-75u lbl-sm" data-key="CapsLock">Caps</button>
                        <button class="key" data-key="KeyA">A</button>
                        <button class="key" data-key="KeyS">S</button>
                        <button class="key" data-key="KeyD">D</button>
                        <button class="key" data-key="KeyF">F</button>
                        <button class="key" data-key="KeyG">G</button>
                        <button class="key" data-key="KeyH">H</button>
                        <button class="key" data-key="KeyJ">J</button>
                        <button class="key" data-key="KeyK">K</button>
                        <button class="key" data-key="KeyL">L</button>
                        <button class="key" data-key="Semicolon">:<br>;</button>
                        <button class="key" data-key="Quote">"<br>'</button>
                        <button class="key key-enter w-2-25u" data-key="Enter">Enter</button>
                    </div>

                    <div class="kb-row">
                        <button class="key key-accent w-2-25u" data-key="ShiftLeft">Shift</button>
                        <button class="key" data-key="KeyZ">Z</button>
                        <button class="key" data-key="KeyX">X</button>
                        <button class="key" data-key="KeyC">C</button>
                        <button class="key" data-key="KeyV">V</button>
                        <button class="key" data-key="KeyB">B</button>
                        <button class="key" data-key="KeyN">N</button>
                        <button class="key" data-key="KeyM">M</button>
                        <button class="key" data-key="Comma"><<br>,</button>
                        <button class="key" data-key="Period">><br>.</button>
                        <button class="key" data-key="Slash">?<br>/</button>
                        <button class="key key-accent w-2-75u" data-key="ShiftRight">Shift</button>
                    </div>

                    <div class="kb-row">
                        <button class="key key-accent w-1-25u lbl-sm" data-key="ControlLeft">Ctrl</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="MetaLeft">Win</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="AltLeft">Alt</button>
                        <button class="key w-6-25u" data-key="Space">Space</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="AltRight">Alt</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="MetaRight">Win</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="ContextMenu">Menu</button>
                        <button class="key key-accent w-1-25u lbl-sm" data-key="ControlRight">Ctrl</button>
                    </div>
                </div>

                <div class="navigation-block">
                    <div class="nav-grid">
                        <button class="key key-accent lbl-sm" data-key="PrintScreen">PrtSc</button>
                        <button class="key key-accent lbl-sm" data-key="ScrollLock">ScrLk</button>
                        <button class="key key-accent lbl-sm" data-key="Pause">Pause</button>
                    </div>
                    <div class="nav-grid row-space" style="grid-template-rows: repeat(2, var(--u)); height: calc(var(--u) * 2 + var(--gap));">
                        <button class="key lbl-sm" data-key="Insert">Ins</button>
                        <button class="key lbl-sm" data-key="Home">Home</button>
                        <button class="key lbl-sm" data-key="PageUp">PgUp</button>
                        <button class="key lbl-sm" data-key="Delete">Del</button>
                        <button class="key lbl-sm" data-key="End">End</button>
                        <button class="key lbl-sm" data-key="PageDown">PgDn</button>
                    </div>
                    <div class="arrow-grid">
                        <div></div>
                        <button class="key key-accent" data-key="ArrowUp">↑</button>
                        <div></div>
                        <button class="key key-accent" data-key="ArrowLeft">←</button>
                        <button class="key key-accent" data-key="ArrowDown">↓</button>
                        <button class="key key-accent" data-key="ArrowRight">→</button>
                    </div>
                </div>

                <div class="numpad-block">
                    <div class="led-panel">
                        <div class="led-item"><span>NUM</span><div class="led-light active" id="led-num"></div></div>
                        <div class="led-item"><span>CAPS</span><div class="led-light" id="led-caps"></div></div>
                        <div class="led-item"><span>SCROLL</span><div class="led-light" id="led-scroll"></div></div>
                    </div>
                    <div class="numpad-grid">
                        <button class="key key-fn lbl-sm" data-key="NumLock">Num</button>
                        <button class="key key-accent" data-key="NumpadDivide">/</button>
                        <button class="key key-accent" data-key="NumpadMultiply">*</button>
                        <button class="key key-accent" data-key="NumpadSubtract">-</button>
                        <button class="key" data-key="Numpad7">7</button>
                        <button class="key" data-key="Numpad8">8</button>
                        <button class="key" data-key="Numpad9">9</button>
                        <button class="key key-accent h-2u" data-key="NumpadAdd">+</button>
                        <button class="key" data-key="Numpad4">4</button>
                        <button class="key" data-key="Numpad5">5</button>
                        <button class="key" data-key="Numpad6">6</button>
                        <button class="key" data-key="Numpad1">1</button>
                        <button class="key" data-key="Numpad2">2</button>
                        <button class="key" data-key="Numpad3">3</button>
                        <button class="key key-enter h-2u" data-key="NumpadEnter">Ent</button>
                        <button class="key span-2-h" data-key="Numpad0">0</button>
                        <button class="key" data-key="NumpadDecimal">.</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="toast-notification" id="toastMessage">
        <span id="toastIcon">ℹ️</span>
        <span id="toastText">Xabar</span>
    </div>

    <script>
        function changeLedColor(colorHex, colorName) {
            document.documentElement.style.setProperty('--led-color', colorHex);
            document.body.style.backgroundColor = colorHex + '15'; 
            showToast(`LED rangi: ${colorName} ga o'zgartirildi 💡`, "💡");
        }

        let typedText = "// Salom! Klavaturada yozing...\n";
        const typedCodeEl = document.getElementById('typedCode');

        window.addEventListener('keydown', (e) => {
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab"].includes(e.code)) {
                e.preventDefault();
            }

            const keyEl = document.querySelector(`[data-key="${e.code}"]`);
            if (keyEl) keyEl.classList.add('pressed');
            updateLEDs(e);

            if (e.key.length === 1) {
                typedText += e.key;
            } else if (e.code === 'Enter') {
                typedText += "\n";
            } else if (e.code === 'Backspace') {
                typedText = typedText.slice(0, -1);
            } else if (e.code === 'Space') {
                typedText += " ";
            }
            typedCodeEl.textContent = typedText;
        });

        window.addEventListener('keyup', (e) => {
            const keyEl = document.querySelector(`[data-key="${e.code}"]`);
            if (keyEl) keyEl.classList.remove('pressed');
        });

        function updateLEDs(e) {
            if (e.getModifierState('CapsLock')) document.getElementById('led-caps').classList.add('active');
            else document.getElementById('led-caps').classList.remove('active');

            if (e.getModifierState('NumLock')) document.getElementById('led-num').classList.add('active');
            else document.getElementById('led-num').classList.remove('active');
        }

        const flashOverlay = document.getElementById('flashOverlay');
        function flashCamera() {
            flashOverlay.classList.add('active');
            setTimeout(() => flashOverlay.classList.remove('active'), 120);
            showToast("Rasmga olindi! 📸", "📸");
        }

        let isMicOn = false;
        function toggleMic() {
            isMicOn = !isMicOn;
            if(isMicOn) showToast("Voice recording enabled 🎙️", "🎙️");
            else showToast("Voice recording deleted ⏹️", "⏹️");
        }

        let isMonitorOff = false;
        const monitorOffLayer = document.getElementById('monitorOffLayer');
        const miniMonitorOffLayer = document.getElementById('miniMonitorOffLayer');

        function toggleMonitor() {
            isMonitorOff = !isMonitorOff;
            if(isMonitorOff) {
                monitorOffLayer.classList.add('active');
                miniMonitorOffLayer.classList.add('active');
                showToast("Monitors turned off⬛", "⬛");
            } else {
                monitorOffLayer.classList.remove('active');
                miniMonitorOffLayer.classList.remove('active');
                showToast("Monitors turned on 🖥️", "🖥️");
            }
        }

        const mouseGlow = document.getElementById('mouseGlow');
        function clickMouse() {
            mouseGlow.classList.add('active');
            setTimeout(() => mouseGlow.classList.remove('active'), 250);
            showToast("Mouse click 🖱️", "🖱️");
        }

        let toastTimer;
        function showToast(text, iconSymbol) {
            const toast = document.getElementById('toastMessage');
            document.getElementById('toastText').textContent = text;
            document.getElementById('toastIcon').textContent = iconSymbol;
            toast.classList.add('show');
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
