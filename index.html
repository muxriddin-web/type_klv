<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Mechanical Full-Size Keyboard</title>
    <style>
        /* jS Dinamik O'lcham Tizimi (Har bir element shu yerga bog'liq) */
        :root {
            /* 25 ta standart u-birlik klaviaturaning to'liq kengligini tashkil qiladi */
            --u: min(44px, calc((100vw - 40px) / 25.5));
            --gap: calc(var(--u) * 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f1015;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Umumiy Klaviatura Korpusi (Ekranga nisbatan 100% moslashuvchan) */
        .keyboard-frame {
            background: #1a1b23;
            padding: calc(var(--u) * 0.45);
            border-radius: calc(var(--u) * 0.35);
            box-shadow: 
                0 calc(var(--u) * 0.5) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(255, 255, 255, 0.05),
                inset 0 calc(var(--u) * -0.15) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.6);
            border: calc(var(--u) * 0.08) solid #252733;
            display: flex;
            gap: calc(var(--u) * 0.35);
            width: max-content;
            max-width: 100%;
        }

        /* 1. ASOSIY YOZUV BLOKI */
        .main-typing-block {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        /* 2. NAVIGATSIYA VA STRELKALAR BLOKI */
        .navigation-block {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: calc(var(--u) * 3 + var(--gap) * 2);
        }

        /* 3. NUMPAD BLOKI */
        .numpad-block {
            display: flex;
            flex-direction: column;
            gap: calc(var(--gap) * 2);
            width: calc(var(--u) * 4 + var(--gap) * 3);
        }

        /* Qatorlar uchun umumiy boshqaruv */
        .kb-row {
            display: flex;
            gap: var(--gap);
        }

        /* F-Tugmalar orasidagi bo'shliqlar */
        .f-gap {
            margin-right: calc(var(--u) * 0.3);
        }

        /* Dinamik Mexanik Tugmalar (Keycaps) */
        .key {
            background: #232531;
            color: #e2e8f0;
            border: none;
            border-radius: calc(var(--u) * 0.13);
            font-size: calc(var(--u) * 0.27);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: var(--u);
            width: var(--u); /* Standart 1u */
            position: relative;
            transition: all 0.04s ease;
            box-shadow: 
                0 calc(var(--u) * 0.08) 0 #14151f,
                0 calc(var(--u) * 0.1) calc(var(--u) * 0.15) rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Tugma bosilgandagi dinamik 3D effekt */
        .key:active, .key.pressed {
            transform: translateY(calc(var(--u) * 0.08));
            box-shadow: 
                0 0 0 #14151f,
                0 1px 2px rgba(0, 0, 0, 0.6),
                inset 0 1px 3px rgba(0, 0, 0, 0.4);
            background: #00ffcc !important; /* Cyberpunk Neon RGB */
            color: #0b0c10 !important;
        }

        /* Maxsus tugmalar ranglari */
        .key-esc { background: #e53e3e; color: #fff; }
        .key-accent { background: #2d3142; color: #8be9fd; }
        .key-fn { background: #38a169; color: #fff; }
        .key-enter { background: #3182ce; color: #fff; }

        /* MULTI-UNIT (U) HAQIQIY O'LCHAMLAR NISBATI */
        .w-1-25u { width: calc(var(--u) * 1.25); }  /* Ctrl, Alt, Win */
        .w-1-5u  { width: calc(var(--u) * 1.5); }   /* Tab, Backslash */
        .w-1-75u { width: calc(var(--u) * 1.75); }  /* CapsLock */
        .w-2u    { width: calc(var(--u) * 2); }     /* Backspace */
        .w-2-25u { width: calc(var(--u) * 2.25); }  /* Left Shift, Enter */
        .w-2-75u { width: calc(var(--u) * 2.75); }  /* Right Shift */
        .w-6-25u { width: calc(var(--u) * 6.25); }  /* Spacebar */

        /* Navigatsiya va Numpad Grid tizimlari */
        .nav-grid, .arrow-grid {
            display: grid;
            grid-template-columns: repeat(3, var(--u));
            gap: var(--gap);
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(4, var(--u));
            grid-template-rows: repeat(5, var(--u));
            gap: var(--gap);
        }

        /* Vertikal uzun tugmalar (Numpad + va Enter) */
        .h-2u {
            grid-row: span 2;
            height: calc(var(--u) * 2 + var(--gap));
        }
        .span-2-h {
            grid-column: span 2;
            width: calc(var(--u) * 2 + var(--gap));
        }

        /* LED Panel qismi */
        .led-panel {
            background: #14151f;
            padding: calc(var(--u) * 0.1) calc(var(--u) * 0.2);
            border-radius: calc(var(--u) * 0.12);
            display: flex;
            justify-content: space-between;
            border: 1px solid #2d3142;
        }
        .led-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: calc(var(--u) * 0.2);
            color: #718096;
            font-weight: bold;
            gap: 2px;
        }
        .led-light {
            width: calc(var(--u) * 0.13);
            height: calc(var(--u) * 0.13);
            background-color: #2d3748;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .led-light.active {
            background-color: #38a169;
            box-shadow: 0 0 8px #48bb78, 0 0 3px #48bb78;
        }

        .lbl-sm { font-size: calc(var(--u) * 0.18); line-height: 1.1; }
        .row-space { margin-top: calc(var(--u) * 0.15); } /* F qatordan keyingi joy */
    </style>
</head>
<body>

    <div class="keyboard-frame">
        
        <div class="main-typing-block">
            <div class="kb-row">
                <button class="key key-esc" data-key="Escape">Esc</button>
                <div style="width: calc(var(--u) * 0.5);"></div>
                <button class="key key-accent" data-key="F1">F1</button>
                <button class="key key-accent" data-key="F2">F2</button>
                <button class="key key-accent" data-key="F3">F3</button>
                <button class="key key-accent f-gap" data-key="F4">F4</button>
                
                <button class="key key-accent" data-key="F5">F5</button>
                <button class="key key-accent" data-key="F6">F6</button>
                <button class="key key-accent" data-key="F7">F7</button>
                <button class="key key-accent f-gap" data-key="F8">F8</button>
                
                <button class="key key-accent" data-key="F9">F9</button>
                <button class="key key-accent" data-key="F10">F10</button>
                <button class="key key-accent" data-key="F11">F11</button>
                <button class="key key-accent" data-key="F12">F12</button>
            </div>

            <div class="kb-row row-space">
                <button class="key" data-key="Backquote">~<br>`</button>
                <button class="key" data-key="Digit1">!<br>1</button>
                <button class="key" data-key="Digit2">@<br>2</button>
                <button class="key" data-key="Digit3">#<br>3</button>
                <button class="key" data-key="Digit4">$<br>4</button>
                <button class="key" data-key="Digit5">%<br>5</button>
                <button class="key" data-key="Digit6">^<br>6</button>
                <button class="key" data-key="Digit7">&<br>7</button>
                <button class="key" data-key="Digit8">*<br>8</button>
                <button class="key" data-key="Digit9">(<br>9</button>
                <button class="key" data-key="Digit0">)<br>0</button>
                <button class="key" data-key="Minus">_<br>-</button>
                <button class="key" data-key="Equal">+<br>=</button>
                <button class="key key-accent w-2u lbl-sm" data-key="Backspace">Backspace</button>
            </div>

            <div class="kb-row">
                <button class="key key-accent w-1-5u" data-key="Tab">Tab</button>
                <button class="key" data-key="KeyQ">Q</button>
                <button class="key" data-key="KeyW">W</button>
                <button class="key" data-key="KeyE">E</button>
                <button class="key" data-key="KeyR">R</button>
                <button class="key" data-key="KeyT">T</button>
                <button class="key" data-key="KeyY">Y</button>
                <button class="key" data-key="KeyU">U</button>
                <button class="key" data-key="KeyI">I</button>
                <button class="key" data-key="KeyO">O</button>
                <button class="key" data-key="KeyP">P</button>
                <button class="key" data-key="BracketLeft">{<br>[</button>
                <button class="key" data-key="BracketRight">}<br>]</button>
                <button class="key w-1-5u" data-key="Backslash">|<br>\</button>
            </div>

            <div class="kb-row">
                <button class="key key-accent w-1-75u lbl-sm" data-key="CapsLock">Caps Lock</button>
                <button class="key" data-key="KeyA">A</button>
                <button class="key" data-key="KeyS">S</button>
                <button class="key" data-key="KeyD">D</button>
                <button class="key" data-key="KeyF">F</button>
                <button class="key" data-key="KeyG">G</button>
                <button class="key" data-key="KeyH">H</button>
                <button class="key" data-key="KeyJ">J</button>
                <button class="key" data-key="KeyK">K</button>
                <button class="key" data-key="KeyL">L</button>
                <button class="key" data-key="Semicolon">:<br>;</button>
                <button class="key" data-key="Quote">"<br>'</button>
                <button class="key key-enter w-2-25u" data-key="Enter">Enter</button>
            </div>

            <div class="kb-row">
                <button class="key key-accent w-2-25u" data-key="ShiftLeft">Shift</button>
                <button class="key" data-key="KeyZ">Z</button>
                <button class="key" data-key="KeyX">X</button>
                <button class="key" data-key="KeyC">C</button>
                <button class="key" data-key="KeyV">V</button>
                <button class="key" data-key="KeyB">B</button>
                <button class="key" data-key="KeyN">N</button>
                <button class="key" data-key="KeyM">M</button>
                <button class="key" data-key="Comma"><<br>,</button>
                <button class="key" data-key="Period">><br>.</button>
                <button class="key" data-key="Slash">?<br>/</button>
                <button class="key key-accent w-2-75u" data-key="ShiftRight">Shift</button>
            </div>

            <div class="kb-row">
                <button class="key key-accent w-1-25u lbl-sm" data-key="ControlLeft">Ctrl</button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="MetaLeft">Win</button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="AltLeft">Alt</button>
                <button class="key w-6-25u" data-key="Space"></button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="AltRight">Alt</button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="MetaRight">Win</button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="ContextMenu">Menu</button>
                <button class="key key-accent w-1-25u lbl-sm" data-key="ControlRight">Ctrl</button>
            </div>
        </div>

        <div class="navigation-block">
            <div class="nav-grid">
                <button class="key key-accent lbl-sm" data-key="PrintScreen">PrtSc<br>SysRq</button>
                <button class="key key-accent lbl-sm" data-key="ScrollLock">Scroll<br>Lock</button>
                <button class="key key-accent lbl-sm" data-key="Pause">Pause<br>Break</button>
            </div>
            
            <div class="nav-grid row-space" style="grid-template-rows: repeat(2, var(--u)); height: calc(var(--u) * 2 + var(--gap));">
                <button class="key lbl-sm" data-key="Insert">Insert</button>
                <button class="key lbl-sm" data-key="Home">Home</button>
                <button class="key lbl-sm" data-key="PageUp">PgUp</button>
                <button class="key lbl-sm" data-key="Delete">Delete</button>
                <button class="key lbl-sm" data-key="End">End</button>
                <button class="key lbl-sm" data-key="PageDown">PgDn</button>
            </div>

            <div class="arrow-grid">
                <div></div>
                <button class="key key-accent" data-key="ArrowUp">↑</button>
                <div></div>
                <button class="key key-accent" data-key="ArrowLeft">←</button>
                <button class="key key-accent" data-key="ArrowDown">↓</button>
                <button class="key key-accent" data-key="ArrowRight">→</button>
            </div>
        </div>

        <div class="numpad-block">
            <div class="led-panel">
                <div class="led-item"><span>NUM</span><div class="led-light active" id="led-num"></div></div>
                <div class="led-item"><span>CAPS</span><div class="led-light" id="led-caps"></div></div>
                <div class="led-item"><span>SCROLL</span><div class="led-light" id="led-scroll"></div></div>
            </div>

            <div class="numpad-grid">
                <button class="key key-fn lbl-sm" data-key="NumLock">Num<br>Lock</button>
                <button class="key key-accent" data-key="NumpadDivide">/</button>
                <button class="key key-accent" data-key="NumpadMultiply">*</button>
                <button class="key key-accent" data-key="NumpadSubtract">-</button>

                <button class="key" data-key="Numpad7">7</button>
                <button class="key" data-key="Numpad8">8</button>
                <button class="key" data-key="Numpad9">9</button>
                <button class="key key-accent h-2u" data-key="NumpadAdd">+</button>

                <button class="key" data-key="Numpad4">4</button>
                <button class="key" data-key="Numpad5">5</button>
                <button class="key" data-key="Numpad6">6</button>

                <button class="key" data-key="Numpad1">1</button>
                <button class="key" data-key="Numpad2">2</button>
                <button class="key" data-key="Numpad3">3</button>
                <button class="key key-enter h-2u" data-key="NumpadEnter">Ent</button>

                <button class="key span-2-h" data-key="Numpad0">0</button>
                <button class="key" data-key="NumpadDecimal">.</button>
            </div>
        </div>

    </div>

    <script>
        // Jismoniy klaviatura hodisalari
        window.addEventListener('keydown', (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", "Space", "Tab", "Delete", "Insert", "Backspace"].includes(e.code)) {
                e.preventDefault(); // Brauzer skrolini to'xtatish
            }

            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            if (keyElement) {
                keyElement.classList.add('pressed');
            }

            updateSystemLEDs(e);
        });

        window.addEventListener('keyup', (e) => {
            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            if (keyElement) {
                keyElement.classList.remove('pressed');
            }
        });

        // LED chiroqlarini sinxronlash
        function updateSystemLEDs(e) {
            const capsLed = document.getElementById('led-caps');
            const numLed = document.getElementById('led-num');
            const scrollLed = document.getElementById('led-scroll');

            if (e.getModifierState('CapsLock')) capsLed.classList.add('active');
            else capsLed.classList.remove('active');

            if (e.getModifierState('NumLock')) numLed.classList.add('active');
            else numLed.classList.remove('active');

            if (e.getModifierState('ScrollLock')) scrollLed.classList.add('active');
            else scrollLed.classList.remove('active');
        }

        // Ekrandan bosganda ham chiroqlarni o'zgartirish
        document.querySelector('[data-key="NumLock"]').addEventListener('click', () => {
            document.getElementById('led-num').classList.toggle('active');
        });
        document.querySelector('[data-key="CapsLock"]').addEventListener('click', () => {
            document.getElementById('led-caps').classList.toggle('active');
        });
    </script>
</body>
</html>
